  kind: physical-two-process
  covers: two REAL stock-node child processes (children/k02-receipt-worker.mjs) sharing ONE SQLite file race the SAME turn; exactly one child commits+ACKs admitted, the loser replays the SAME original receipt idempotentReplay with zero new effect; a changed-input racing second submission refuses typed; sequential 20-turn interleave across processes stays consistent
  verdicts: [P-single-winner-original-ack, P-loser-idempotent-replay, N-changed-input-race-typed-conflict, P-cross-process-sequence]

