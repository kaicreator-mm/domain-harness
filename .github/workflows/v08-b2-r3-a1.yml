name: V08 #984 B2 R3 A1 trusted native authority and Host port closure (research only)
on:
  push:
    branches:
      - spike/v08-b2-r3-a1-984
  pull_request:
    branches:
      - spike/v08-gatea-kind-authority-960-r2
permissions:
  contents: read
jobs:
  a1-full-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Exact immutable checkout subject
        shell: bash
        run: |
          set -euo pipefail
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "EXACT_SHA=$(git rev-parse HEAD)"
          echo "EXACT_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --version
      - name: Full repository build lint types and tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run lint
          npm run typecheck
          npm test
      - name: Immutable reviewed B1 regression
        run: node --test experiments/v08-gatea-b1-955-r2/tests/b1.test.mjs
      - name: Original B2 R1 regression
        run: node --import tsx --test experiments/v08-gatea-repair-942/tests/kind-authority-b2.test.mjs
      - name: R2 native physical B regression (unchanged, attributed e11a051)
        run: node --import tsx --test experiments/v08-gatea-repair-942/tests/kind-authority-b2-r2.test.mjs
      - name: A1 A3 matrix — trusted native authority + non-overridable Host ports
        run: node --import tsx --test experiments/v08-b2-r3-a1/tests/kind-authority-b2-r3-a1.test.mjs
      - name: Research gates never self-approve
        run: |
          echo "NO_SECOND_RUNTIME_OR_JOURNAL=YES"
          echo "ORIGINAL_V07_STATE_EFFECT_JOURNAL=SOLE_AUTHORITY"
          echo "DURABLE_RESTART_RECOVERY=NOT_PROVEN"
          echo "K1_UNIFIED_ASSEMBLY=PARTIAL_983_SEPARATE"
          echo "TECH_GATE_1=NOT_SELF_APPROVED"
          echo "PRODUCT_FREEZE=BLOCKED"
          echo "MERGE=NO"
  a1-fast-falsifiers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build and source-bound adversarial suites
        shell: bash
        run: |
          set -euo pipefail
          echo "EXACT_SHA=$(git rev-parse HEAD)"
          echo "EXACT_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci
          npm run build
          node --test experiments/v08-gatea-b1-955-r2/tests/b1.test.mjs
          node --import tsx --test experiments/v08-gatea-repair-942/tests/kind-authority-b2.test.mjs
          node --import tsx --test experiments/v08-gatea-repair-942/tests/kind-authority-b2-r2.test.mjs
          node --import tsx --test experiments/v08-b2-r3-a1/tests/kind-authority-b2-r3-a1.test.mjs
