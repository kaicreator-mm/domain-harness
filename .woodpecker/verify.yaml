# DomainHarness: inexpensive PR/push assurance, with one explicit full regression
# on the final frozen release candidate. The workflow name/path stays 'verify'
# to preserve the existing ci/woodpecker/pr/verify status context.
when:
  - event: pull_request
  - event: push
    branch: [main, v0.2, v0.3, v0.4]
  - event: manual

# ECF elastic workers use Woodpecker's local backend: steps run on the
# Alpine worker VM (Node 24 + git), NOT inside the 'bash' image container.
labels:
  backend: local

steps:
  - name: verify
    image: bash
    commands:
      - git --version && node --version && npm --version
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - node -e 'const major = Number(process.versions.node.split(".")[0]); if (major !== 24) { console.error("v0.10.2 requires Node24, actual " + process.version); process.exit(1); }'
      - npm ci
      # Fast, cross-workspace static/packaging gates (includes committed-dist check).
      - npm run build
      - npm run lint
      - npm run typecheck
      # Selected Node24 API, bare-import/hygiene and tarball-inventory smoke (T07b).
      # T09 owns the separate real Tiny/Rich fresh-installed and external-producer journeys.
      - node --import tsx --test tests/compiler/v010-import-hook-registry.test.ts tests/compiler/v010-public-api-boundary.test.ts tests/compiler/v0102-import-direction.test.ts tests/compiler/v0102-tarball-inventory.test.ts
      # Distribution-only output isolation/CMD negatives, no npm publish/pack/upload.
      - node --test scripts/distribution/path-safety.test.mjs

  # Trigger this workflow MANUALLY on the pinned final release-candidate ref.
  # Do not run full regression automatically on every PR or main push.
  # Hidden validation, physical-host qualification and Critical Journeys are
  # independently evidenced by #1037, never inferred from this step alone.
  - name: full-regression
    image: bash
    when:
      - event: manual
    commands:
      - npm test
