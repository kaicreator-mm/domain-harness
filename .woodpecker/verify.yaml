when:
  - event: pull_request
  - event: push
    branch: main

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 1
      recursive: false
      lfs: false

steps:
  - name: verify
    image: node:22-bookworm
    commands:
      - npm ci
      - npm run lint
      - npm run typecheck
      - npm test
