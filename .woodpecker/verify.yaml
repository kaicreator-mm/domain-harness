when:
  - event: pull_request
  - event: push
    branch: [main, v0.2]

clone:
  - name: git
    image: /usr/local/bin/plugin-git
    settings:
      partial: false
      depth: 1
      recursive: false
      lfs: false

steps:
  - name: verify
    image: /usr/bin/bash
    commands:
      - NODE_BIN="$(find /usr /usr/local /opt /root /home -type f -name node -perm -111 2>/dev/null | head -n 1)"
      - test -n "$NODE_BIN"
      - "$NODE_BIN" --version
