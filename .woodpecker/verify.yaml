when:
  - event: pull_request
  - event: push
    branch: [main, v0.2]

clone:
  - name: git
    image: /usr/local/bin/plugin-git
    settings:
      partial: false
      depth: 1
      recursive: false
      lfs: false

steps:
  - name: verify
    image: /usr/bin/bash
    commands:
      - node --version
