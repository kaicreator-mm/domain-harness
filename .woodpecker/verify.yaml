when:
  - event: pull_request
  - event: push
    branch: main

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 1
      recursive: false
      lfs: false

steps:
  - name: verify
    image: bash
    commands:
      - node --version
      - npm --version
      - node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) { console.error("Node >=22 required"); process.exit(1); }'
      - npm ci
      - npm run lint
      - npm run typecheck
      - npm test
