when:
  - event: pull_request
  - event: push
    branch: [main, v0.2]

clone:
  - name: git
    image: /usr/local/bin/plugin-git
    settings:
      partial: false
      depth: 1
      recursive: false
      lfs: false

steps:
  - name: verify
    image: /usr/bin/bash
    commands:
      - export PATH="/usr/local/bin:$PATH"
      - node --version
      - npm --version
      - node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) { console.error("Node >=22 required"); process.exit(1); }'
      - npm ci
      - npm run build
      - npm run lint
