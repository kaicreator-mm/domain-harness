# 仅检出本版原生 SDK 与真实消费者；一个 Clone、一次 npm ci。
when:
  - event: pull_request
    branch: 'version/v0.11.*'
    path:
      include:
        - '.woodpecker/**'
        - 'packages/domain-harness/**'
        - 'scripts/**'
        - 'examples/native-domain-app/**'
        - '.agents/**'
        - 'package.json'
        - 'package-lock.json'
        - 'tsconfig.base.json'
        - 'eslint.config.mjs'
      on_empty: true
  - event: manual
    branch: 'version/v0.11.*'
labels:
  backend: local
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: true
      depth: 1
      tags: false
      lfs: false
      recursive: false
      sparse:
        - packages/domain-harness
        - scripts
        - examples/native-domain-app
        - .agents
steps:
  - name: verify
    image: bash
    commands:
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - node -e 'const [major,minor]=process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 12)) process.exit(1)'
      - npm ci --no-audit --no-fund
      - npm run build
      - npm run typecheck
      - npm run lint
      - npm test
      - npm run test:demo
      - DH_NATIVE_NPM_REGISTRY=http://host.docker.internal:14873 npm run test:consumer
