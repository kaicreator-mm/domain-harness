when:
  - event: pull_request
  - event: push
    branch: [main, v0.2, v0.3]

# ECF elastic workers run the agent with backend=local (VM-is-the-sandbox):
# steps execute on the Alpine host (node24 + git preinstalled).
labels:
  backend: local

steps:
  - name: verify
    image: bash
    commands:
      - git --version && node --version && npm --version
      - node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) { console.error("Node >=22 required"); process.exit(1); }'
      - npm ci
      - npm run build
      - npm run lint
      - npm run typecheck
      - npm test
