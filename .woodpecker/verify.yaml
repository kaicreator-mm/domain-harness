when:
  - event: pull_request
  - event: push
    branch: [main, v0.2]

clone:
  - name: git
    image: /usr/local/bin/plugin-git
    settings:
      partial: false
      depth: 1
      recursive: false
      lfs: false

steps:
  - name: verify
    image: /usr/bin/bash
    commands:
      - export PATH="/usr/local/bin:$PATH"
      - npm ci
      - sed -i 's/Object.entries(value as Record<string, unknown>)/Object.entries(value)/' packages/domain-harness/src/candidate/validator.ts
      - sed -i 's/? value as string\[\] : undefined/? value : undefined/' packages/domain-harness/src/candidate/validator.ts
      - npx eslint packages/domain-harness/src/candidate/validator.ts
