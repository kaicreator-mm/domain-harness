when:
  - event: pull_request
  - event: push
    branch: [main, v0.2, v0.3]

# The repository uses Woodpecker's local backend. Avoid depending on
# agent-specific absolute executable paths: skip the default plugin-git clone,
# use host git for exact checkout, and resolve the build shell from PATH.
skip_clone: true

steps:
  - name: verify
    image: bash
    commands:
      - git --version
      - git init .
      - git fetch --no-tags --depth=1 "$CI_REPO_CLONE_URL" "$CI_COMMIT_SHA"
      - git checkout --detach FETCH_HEAD
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - node --version
      - npm --version
      - node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) { console.error("Node >=22 required"); process.exit(1); }'
      - npm ci
      # Type-aware eslint resolves cross-workspace imports through built
      # dist/*.d.ts, so workspaces must be built before lint.
      - npm run build
      - npm run lint
      - npm run typecheck
      - npm test
