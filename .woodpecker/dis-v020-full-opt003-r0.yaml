# OPT-003 Full R211 (lane O3): local data-only Evolution Slot activation
# lifecycle over the selected AOT/SDK. Atomic activate+pin, data-driven
# execution, revoke/rollback, restart invalidation; forged-code/cancel-race/
# wrong-task/stale-epoch fail-closed negatives. Never mints qualification,
# Experience, Effect, Host-authenticated activation or Release.
when:
  - event: pull_request
  - event: manual

labels:
  backend: local

skip_clone: true

steps:
  - name: clone-retry
    image: bash
    commands:
      - git init --object-format sha1
      - git config --global --replace-all safe.directory "$CI_WORKSPACE"
      - git remote add origin "$CI_REPO_CLONE_URL"
      - |
        n=0
        while true; do
          if git fetch --no-tags --depth=1 --filter=tree:0 origin "+$CI_COMMIT_SHA" && git reset --hard -q "$CI_COMMIT_SHA"; then break; fi
          n=$((n+1))
          if [ "$n" -ge 5 ]; then echo "clone failed after $n attempts"; exit 1; fi
          echo "clone attempt $n failed (transient egress), retrying"
          sleep 10
        done
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"

  - name: full-opt003-r0-native
    image: bash
    commands:
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - node --version
      - node -e "if(Number(process.versions.node.split('.')[0])<24)process.exit(1)"
      - npm_config_better_sqlite3_binary_host_mirror=https://registry.npmmirror.com/-/binary/better-sqlite3 npm ci
      - npm run build
      - node --check examples/dis-v020-native-sdk/full-opt003-r0/evolution-slot.mjs
      - node --check examples/dis-v020-native-sdk/full-opt003-r0/evolution-slot.test.mjs
      - node --check examples/dis-v020-native-sdk/full-opt003-r0/full-opt003-native.test.mjs
      - node --test examples/dis-v020-native-sdk/full-opt003-r0/evolution-slot.test.mjs
      - node --import tsx --test examples/dis-v020-native-sdk/full-opt003-r0/full-opt003-native.test.mjs
