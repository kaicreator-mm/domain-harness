# T07b transitional retained GitHub required-status CONTEXT only (status rule UNKNOWN).
# Not a Node22 compatibility claim: selected Domain App and root engines require Node24.
# Once branch protection verifies this context is not required, delete this file
# through the reviewed T07b gate; until then preserve exact context name.
when:
  - event: pull_request
  - event: manual

labels:
  backend: local

# Transient worker github.com egress (HTTP2 framing curl 16, SSL unexpected
# EOF, DNS, TCP connect timeout) fails the default clone with exit 128 and
# zero test evidence (#2391/2, #2395/1-3, #2398). A yaml `clone:` section
# cannot fix this on this infrastructure: on the local backend the compiler
# drops yaml clone containers and the agent executes the plugin-git binary
# directly, ignoring any step commands. So do the clone as a normal step,
# which does execute its commands here, with a bounded retry.
skip_clone: true

steps:
  - name: clone-retry
    image: bash
    commands:
      - git init --object-format sha1
      - git config --global --replace-all safe.directory "$CI_WORKSPACE"
      - git remote add origin "$CI_REPO_CLONE_URL"
      - |
        n=0
        while true; do
          if git fetch --no-tags --depth=1 --filter=tree:0 origin "+$CI_COMMIT_SHA" && git reset --hard -q "$CI_COMMIT_SHA"; then break; fi
          n=$((n+1))
          if [ "$n" -ge 5 ]; then echo "clone failed after $n attempts"; exit 1; fi
          echo "clone attempt $n failed (transient egress), retrying"
          sleep 10
        done
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"

  - name: verify-min-node
    image: bash
    commands:
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - node --version && npm --version
      - node -e 'if (Number(process.versions.node.split(".")[0]) !== 24) process.exit(1);'
      # See dis-v020-integration.yaml: pin the better-sqlite3 prebuild download
      # to the npmmirror binary mirror; direct github.com egress is unreliable.
      - npm_config_better_sqlite3_binary_host_mirror=https://registry.npmmirror.com/-/binary/better-sqlite3 npm ci
      - npm run build
      - node --import tsx --test tests/compiler/v010-import-hook-registry.test.ts tests/compiler/v010-public-api-boundary.test.ts
