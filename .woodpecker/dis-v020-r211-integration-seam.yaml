# R211 Integrator seam (#1551): O4 OPT-004 promotion manifest -> O3 OPT-003
# stable activation ABI end-to-end reconciliation on the integrated parent.
# Never mints qualification, Effect, Experience or Release.
when:
  - event: pull_request
  - event: manual

labels:
  backend: local

skip_clone: true

steps:
  - name: clone-retry
    image: bash
    commands:
      - git init --object-format sha1
      - git config --global --replace-all safe.directory "$CI_WORKSPACE"
      - git remote add origin "$CI_REPO_CLONE_URL"
      - |
        n=0
        while true; do
          if git fetch --no-tags --depth=1 --filter=tree:0 origin "+$CI_COMMIT_SHA" && git reset --hard -q "$CI_COMMIT_SHA"; then break; fi
          n=$((n+1))
          if [ "$n" -ge 5 ]; then echo "clone failed after $n attempts"; exit 1; fi
          echo "clone attempt $n failed (transient egress), retrying"
          sleep 10
        done
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"

  - name: r211-integration-seam-native
    image: bash
    commands:
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - node --version
      - node -e "if(Number(process.versions.node.split('.')[0])<24)process.exit(1)"
      - npm_config_better_sqlite3_binary_host_mirror=https://registry.npmmirror.com/-/binary/better-sqlite3 npm ci
      - npm run build
      - node --check examples/dis-v020-native-sdk/full-r211-integration/opt004-opt003-activation-seam.test.mjs
      - node --import tsx --test examples/dis-v020-native-sdk/full-r211-integration/opt004-opt003-activation-seam.test.mjs
