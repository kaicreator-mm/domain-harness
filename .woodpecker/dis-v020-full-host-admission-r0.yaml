# DIS #3 / Harness #1527 Phase B (R209): owner-attested full host admission
# for the selected Function dke.ev16.d02.vv.r188.observe — real same-call
# positive (pinned issuer/tenant/Host roots, signed Host receipt, durable
# hash-chained ledger) plus adversarial negatives, and regression of the
# unchanged R188 boundary / O2 negative-only preflight semantics.
when:
  - event: pull_request
  - event: manual
labels:
  backend: local
skip_clone: true
steps:
  - name: clone-exact-sha
    image: bash
    commands:
      - git init --object-format sha1
      - git config --global --replace-all safe.directory "$CI_WORKSPACE"
      - git remote add origin "$CI_REPO_CLONE_URL"
      - |
        n=0
        while true; do
          if git fetch --no-tags --depth=1 --filter=tree:0 origin "+$CI_COMMIT_SHA" && git reset --hard -q "$CI_COMMIT_SHA"; then break; fi
          n=$((n+1))
          if [ "$n" -ge 5 ]; then echo "clone failed after $n attempts"; exit 1; fi
          echo "transient clone egress retry $n"
          sleep 10
        done
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
  - name: dis-full-host-admission-node24
    image: bash
    commands:
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - node --version
      - node -e "if(Number(process.versions.node.split('.')[0])<24)process.exit(1)"
      - npm_config_better_sqlite3_binary_host_mirror=https://registry.npmmirror.com/-/binary/better-sqlite3 npm ci
      - npm run build
      - node --check examples/dis-v020-native-sdk/full-host-admission-r0/admission-host.mjs
      - node --check examples/dis-v020-native-sdk/full-host-admission-r0/admission-host-service.mjs
      - node --check examples/dis-v020-native-sdk/full-host-admission-r0/admission-consumer.mjs
      - node --check examples/dis-v020-native-sdk/full-host-admission-r0/issuer-install.mjs
      - node --check examples/dis-v020-native-sdk/full-host-admission-r0/test-fixture.mjs
      - node --check examples/dis-v020-native-sdk/full-host-admission-r0/provision-owner-trust.mjs
      - node --check examples/dis-v020-native-sdk/full-host-admission-r0/full-host-admission.test.mjs
      - node --import tsx --test examples/dis-v020-native-sdk/full-host-admission-r0/full-host-admission.test.mjs
      - node --import tsx --test examples/dis-v020-native-sdk/r188-current815-o2-host-boundary.test.mjs
      - node --import tsx --test examples/dis-v020-native-sdk/o2-installed-rule-trust-preflight.test.mjs
