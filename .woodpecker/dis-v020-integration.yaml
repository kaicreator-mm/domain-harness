# DIS 0.2 R6 real KDP/SDK seam, physical SQLite Journal and two-Business Domain tests.
# Deliberately no exact Node major gate: exercise the actual worker runtime.
# Independent of the older 'verify' required-status context and release pin.
when:
  - event: pull_request
  - event: manual

labels:
  backend: local

# Transient worker github.com egress (HTTP2 framing curl 16, SSL unexpected
# EOF, DNS, TCP connect timeout) fails the default clone with exit 128 and
# zero test evidence (#2391/2, #2395/1-3, #2398). A yaml `clone:` section
# cannot fix this on this infrastructure: on the local backend the compiler
# drops yaml clone containers and the agent executes the plugin-git binary
# directly, ignoring any step commands. So do the clone as a normal step,
# which does execute its commands here, with a bounded retry.
skip_clone: true

steps:
  - name: clone-retry
    image: bash
    commands:
      - git init --object-format sha1
      - git config --global --replace-all safe.directory "$CI_WORKSPACE"
      - git remote add origin "$CI_REPO_CLONE_URL"
      - |
        n=0
        while true; do
          if git fetch --no-tags --depth=1 --filter=tree:0 origin "+$CI_COMMIT_SHA" && git reset --hard -q "$CI_COMMIT_SHA"; then break; fi
          n=$((n+1))
          if [ "$n" -ge 5 ]; then echo "clone failed after $n attempts"; exit 1; fi
          echo "clone attempt $n failed (transient egress), retrying"
          sleep 10
        done
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"

  - name: dis-v020-integration
    image: bash
    commands:
      - git --version && node --version && npm --version
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      # better-sqlite3's install script downloads its prebuilt binary from
      # github.com releases. That egress is unreliable on this worker (#2228:
      # prebuild-install got 504s and fell back to node-gyp, which needs make
      # the image does not ship). npmmirror mirrors every release asset 1:1 and
      # prebuild-install honors npm_config_<pkg>_binary_host_mirror natively
      # (lib/util.js getHostMirrorUrl).
      - npm_config_better_sqlite3_binary_host_mirror=https://registry.npmmirror.com/-/binary/better-sqlite3 npm ci
      - npm run build
      - node --check examples/dis-v020-sdk-integration/test.mjs
      - node --test examples/dis-v020-sdk-integration/test.mjs
      - node --import tsx --test examples/dis-v020-real-aot-bridge/aot-bridge.test.mjs
      - node --import tsx --test examples/dis-v020-real-aot-bridge/two-domain-physical.test.mjs
      - node --import tsx --test examples/dis-v020-cross-project/consumer.test.mjs
      - node --import tsx --test examples/dis-v020-cross-project/selected-build.test.mjs
      - node --check packages/contracts/dis-v020.mjs
      - node --check tooling/build/dis-v020.mjs
      - node --check packages/microkernel/dis-v020.mjs
      - ./node_modules/.bin/tsc -p examples/dis-v020-native-sdk/tsconfig.json
      - node --import tsx --test examples/dis-v020-native-sdk/native-consumer.test.mjs examples/dis-v020-native-sdk/dke-selected-consumer.test.mjs examples/dis-v020-native-sdk/dke-two-business.test.mjs examples/dis-v020-native-sdk/source-anchor.test.mjs examples/dis-v020-native-sdk/b01-function-contract.test.mjs examples/dis-v020-native-sdk/b01-state-owner.test.mjs examples/dis-v020-native-sdk/b01-abi-regression.test.mjs examples/dis-v020-native-sdk/b02-package-target.test.mjs examples/dis-v020-native-sdk/b02-interaction-parity.test.mjs examples/dis-v020-native-sdk/b02-interaction-adversarial.test.mjs examples/dis-v020-native-sdk/b03-target-closure.test.mjs examples/dis-v020-native-sdk/b03-target-installer.test.mjs examples/dis-v020-native-sdk/b03-target-source-authority.test.mjs examples/dis-v020-native-sdk/b05-host-target.test.mjs examples/dis-v020-native-sdk/b05-full-source-anchors.test.mjs examples/dis-v020-native-sdk/b05-target-consumer.test.mjs examples/dis-v020-native-sdk/b07-function-dependency.test.mjs examples/dis-v020-native-sdk/b07-semantic-relation.test.mjs examples/dis-v020-native-sdk/b08-dke-knowledge-consumer.test.mjs examples/dis-v020-native-sdk/b09-dke-conditional-proof.test.mjs examples/dis-v020-native-sdk/b10-r10-complete-witness.test.mjs examples/dis-v020-native-sdk/b14-r16-source-authenticity.test.mjs examples/dis-v020-native-sdk/b15-r17-guide-compatibility.test.mjs examples/dis-v020-native-sdk/b16-r18-transitive-impact.test.mjs examples/dis-v020-native-sdk/b18-r23-ev16-full-source.test.mjs examples/dis-v020-native-sdk/b19-r26-typed-reader-native.test.mjs examples/dis-v020-native-sdk/b20-nested-function-schema.test.mjs examples/dis-v020-native-sdk/b22-r33-go-triage-native.test.mjs examples/dis-v020-native-sdk/public-function-contract-coverage.test.mjs
      # B06 loopback HTTP lives in isolated test workers, without parallel
      # native-KDP/SQLite fixture contention with other Domain consumer suites.
      # All three cases remain mandatory; do not skip or downgrade.
      - node --import tsx --test --test-concurrency=1 examples/dis-v020-native-sdk/b06-http-transport.test.mjs examples/dis-v020-native-sdk/b06-http-negative.test.mjs examples/dis-v020-native-sdk/b06-http-lifecycle.test.mjs
      - node --import tsx --test --test-concurrency=1 examples/dis-v020-native-sdk/b11-cli-process.test.mjs
      - node --import tsx --test --test-concurrency=1 examples/dis-v020-native-sdk/b12-runx-physical-state-process.test.mjs
      - node --test examples/dis-v020-conformance/validate.test.mjs
      # R83: real original DKE R33 source + B22 Reader against bounded authority model;
      # original Git Blob pins, 768 states, 771 real Reader calls, negative witnesses.
      # Separate from independently reviewed SAP and actual physical Effects.
      - node examples/dis-v020-source-authority-formal/run-r83.mjs
      - node --test examples/dis-v020-conformance/full-ledger.test.mjs
      - node --test examples/dis-v020-conformance/full-ledger-30.test.mjs
      - node --test examples/dis-v020-conformance/full-ledger-34.test.mjs
      - node --test examples/dis-v020-conformance/batch-audit.test.mjs
      - node --test examples/dis-v020-conformance/batch-ledger-18.test.mjs
      - node --test examples/dis-v020-conformance/closure-audit.test.mjs
      - node --test examples/dis-v020-conformance/readiness-gate.test.mjs
      - node --import tsx --test tests/assembly/v010-c01-external-effect.test.ts
