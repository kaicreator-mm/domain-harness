# O1 R211 OPT-001: real AOT-selected bounded DeepSeek Provider.
# Contract suite is network-free (structural + fail-closed negatives with
# test-only injected transports). Live suite performs real DeepSeek calls
# using the DEEPSEEK_API_KEY repo secret; a missing key fails the step red
# (explicit error, exit 1) and never silently skips. Model output is data
# only: no semantic PASS, permission, Effect or qualification is ever minted.
when:
  - event: pull_request
  - event: manual

labels:
  backend: local

skip_clone: true

steps:
  - name: clone-retry
    image: bash
    commands:
      - git init --object-format sha1
      - git config --global --replace-all safe.directory "$CI_WORKSPACE"
      - git remote add origin "$CI_REPO_CLONE_URL"
      - |
        n=0
        while true; do
          if git fetch --no-tags --depth=1 --filter=tree:0 origin "+$CI_COMMIT_SHA" && git reset --hard -q "$CI_COMMIT_SHA"; then break; fi
          n=$((n+1))
          if [ "$n" -ge 5 ]; then echo "clone failed after $n attempts"; exit 1; fi
          echo "clone attempt $n failed (transient egress), retrying"
          sleep 10
        done
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"

  - name: opt001-bounded-contract-native
    image: bash
    commands:
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - node --version
      - node -e "if(Number(process.versions.node.split('.')[0])<24)process.exit(1)"
      - npm_config_better_sqlite3_binary_host_mirror=https://registry.npmmirror.com/-/binary/better-sqlite3 npm ci
      - npm run build
      - node --check examples/dis-v020-native-sdk/full-opt001-r0/opt001-aot-bounded-provider.mjs
      - node --check examples/dis-v020-native-sdk/full-opt001-r0/opt001-bounded-contract.test.mjs
      - node --import tsx --test examples/dis-v020-native-sdk/full-opt001-r0/opt001-bounded-contract.test.mjs

  - name: opt001-live-provider
    image: bash
    secrets: [DEEPSEEK_API_KEY]
    commands:
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - node --check examples/dis-v020-native-sdk/full-opt001-r0/opt001-live-provider.test.mjs
      # deps and build dist are already present from the contract step
      # (same pipeline workspace); the live step only adds real network.
      - node --import tsx --test examples/dis-v020-native-sdk/full-opt001-r0/opt001-live-provider.test.mjs
