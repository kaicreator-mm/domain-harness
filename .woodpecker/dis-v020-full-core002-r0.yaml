# CORE-002 R211 (Lane C2): cohesive Element / multi-Function identity and
# executable Source owner-version lock on the real AOT/SDK assembly seam.
# Never mints qualification, Effect, Release or Matrix promotion.
when:
  - event: pull_request
  - event: manual

labels:
  backend: local

skip_clone: true

steps:
  - name: clone-retry
    image: bash
    commands:
      - git init --object-format sha1
      - git config --global --replace-all safe.directory "$CI_WORKSPACE"
      - git remote add origin "$CI_REPO_CLONE_URL"
      - |
        n=0
        while true; do
          if git fetch --no-tags --depth=1 --filter=tree:0 origin "+$CI_COMMIT_SHA" && git reset --hard -q "$CI_COMMIT_SHA"; then break; fi
          n=$((n+1))
          if [ "$n" -ge 5 ]; then echo "clone failed after $n attempts"; exit 1; fi
          echo "clone attempt $n failed (transient egress), retrying"
          sleep 10
        done
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"

  - name: core002-owner-lock-native
    image: bash
    commands:
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - node --version
      - node -e "if(Number(process.versions.node.split('.')[0])<24)process.exit(1)"
      - npm_config_better_sqlite3_binary_host_mirror=https://registry.npmmirror.com/-/binary/better-sqlite3 npm ci
      - npm run build
      - node --check examples/dis-v020-native-sdk/full-core002-r0/gate-catalog.mjs
      - node --check examples/dis-v020-native-sdk/full-core002-r0/gate-policy.mjs
      - node --check examples/dis-v020-native-sdk/full-core002-r0/gate-rule.mjs
      - node --check examples/dis-v020-native-sdk/full-core002-r0/gate-review.mjs
      - node --check examples/dis-v020-native-sdk/full-core002-r0/core002-owner-lock.mjs
      - node --check examples/dis-v020-native-sdk/full-core002-r0/core002-fixture.mjs
      - node --check examples/dis-v020-native-sdk/full-core002-r0/full-core002.test.mjs
      - node --import tsx --test examples/dis-v020-native-sdk/full-core002-r0/full-core002.test.mjs
