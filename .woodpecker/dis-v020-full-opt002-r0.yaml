# DIS 0.2.0 R211 O2 (OPT-002): authentic trace / holdout / consent engineering layer.
# Real selected AOT/SDK positive evidence + fail-closed negatives. Never mints
# qualification, Experience, Effect, independent Validator endorsement or export.
when:
  - event: pull_request
  - event: manual

labels:
  backend: local

skip_clone: true

steps:
  - name: clone-retry
    image: bash
    commands:
      - git init --object-format sha1
      - git config --global --replace-all safe.directory "$CI_WORKSPACE"
      - git remote add origin "$CI_REPO_CLONE_URL"
      - |
        n=0
        while true; do
          if git fetch --no-tags --depth=1 --filter=tree:0 origin "+$CI_COMMIT_SHA" && git reset --hard -q "$CI_COMMIT_SHA"; then break; fi
          n=$((n+1))
          if [ "$n" -ge 5 ]; then echo "clone failed after $n attempts"; exit 1; fi
          echo "clone attempt $n failed (transient egress), retrying"
          sleep 10
        done
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"

  - name: opt002-full-r0-native
    image: bash
    commands:
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - node --version
      - node -e "if(Number(process.versions.node.split('.')[0])<24)process.exit(1)"
      - npm_config_better_sqlite3_binary_host_mirror=https://registry.npmmirror.com/-/binary/better-sqlite3 npm ci
      - npm run build
      - node --check examples/dis-v020-native-sdk/full-opt002-r0/opt002-trace-receipt.mjs
      - node --check examples/dis-v020-native-sdk/full-opt002-r0/opt002-holdout-policy.mjs
      - node --check examples/dis-v020-native-sdk/full-opt002-r0/opt002-consent-boundary.mjs
      - node --check examples/dis-v020-native-sdk/full-opt002-r0/opt002-validator-admission.mjs
      - node --check examples/dis-v020-native-sdk/full-opt002-r0/full-opt002-r0.test.mjs
      - node --import tsx --test examples/dis-v020-native-sdk/full-opt002-r0/full-opt002-r0.test.mjs
